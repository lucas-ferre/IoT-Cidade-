name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: projeto-sockets

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare Python tests and Protobuf bindings
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          python -m pip install -r gateway/requirements.txt -r client/requirements.txt -r sensor_python/requirements.txt
          protoc -I=common --python_out=gateway common/messages.proto
          protoc -I=common --python_out=client common/messages.proto
          protoc -I=common --python_out=sensor_python common/messages.proto

      - name: Validate Python syntax
        run: python -m compileall -q gateway client sensor_python

      - name: Run gateway, dashboard and sensor regressions
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s sensor_python -p 'test_*.py' -v

      - name: Validate C air quality calculation
        run: |
          gcc -std=c11 -Wall -Wextra -Werror sensor_c/test_aqi.c -lm -o /tmp/test-aqi
          /tmp/test-aqi

      - name: Build service images
        run: docker compose build

      - name: Start the complete environment
        run: docker compose up --detach --wait --wait-timeout 180

      - name: Check dashboard health endpoint
        run: curl --fail --show-error --retry 10 --retry-delay 2 http://127.0.0.1:8501/_stcore/health

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the environment
        if: always()
        run: docker compose down --volumes --remove-orphans
