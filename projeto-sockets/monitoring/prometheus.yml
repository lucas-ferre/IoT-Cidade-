# Configuração do Prometheus — raspa o endpoint /metrics do Gateway (Fase E).
# Acesse o Prometheus em http://localhost:9090
# Grafana (opcional): aponte um data source Prometheus para http://prometheus:9090

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'smartcity_gateway'
    metrics_path: /metrics
    static_configs:
      - targets: ['gateway:9100']
