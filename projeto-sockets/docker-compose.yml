services:
  # ==================================================================
  # 0. CACHE & MESSAGE BROKER (REDIS)
  # ==================================================================
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - smart_city_net
    restart: always

  # ==================================================================
  # 1.A. AGREGADOR JAVA (NETTY)
  # ==================================================================
  aggregator_java:
    build:
      context: .
      dockerfile: aggregators/java/Dockerfile
    container_name: aggregator_java
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AGGREGATOR_ID=java_netty_1
      - MULTICAST_GROUP=239.0.0.1
      - MULTICAST_PORT=5005
      - AES_SECRET_KEY=SmartCityKey1234
    networks:
      - smart_city_net
    restart: always
    depends_on:
      - redis

  # ==================================================================
  # 1.B. AGREGADOR RUST (TOKIO)
  # ==================================================================
  aggregator_rust:
    build:
      context: .
      dockerfile: aggregators/rust/Dockerfile
    container_name: aggregator_rust
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AGGREGATOR_ID=rust_tokio_1
      - MULTICAST_GROUP=239.0.0.1
      - MULTICAST_PORT=5005
      - AES_SECRET_KEY=SmartCityKey1234
    networks:
      - smart_city_net
    restart: always
    depends_on:
      - redis

  # ==================================================================
  # 1. GATEWAY INTELIGENTE (HUB COORDENADOR & OLAP)
  # ==================================================================
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
      args:
        TARGET_SERVICE: gateway
    container_name: gateway
    ports:
      # UDP 5000 e 5002 foram movidos para os agregadores
      - "5001:5001/tcp"  # Interface de streaming analítico e atuação
      - "5007:5007/tcp"  # Interface de autenticação dos sensores
    volumes:
      - gateway_db:/app/gateway/db
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - GATEWAY_LICENSE_KEY=SMARTCITY-V1-FULL-LICENSE
      - AES_SECRET_KEY=SmartCityKey1234
    networks:
      - smart_city_net
    restart: always
    depends_on:
      - redis
    stop_grace_period: 10s
    healthcheck:
      test: [
        "CMD-SHELL",
        "python -c 'import socket; s=socket.socket(socket.AF_INET, socket.SOCK_STREAM); s.settimeout(1.0); s.connect((\"127.0.0.1\", 5001)); s.close()' || exit 1"
      ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s

  # ==================================================================
  # 2. SENSOR DE CLIMA (NÓ C - CONTÍNUO)
  # ==================================================================
  sensor_clima:
    build:
      context: .
      dockerfile: sensor_c/Dockerfile
      args:
        TARGET_SERVICE: sensor_clima
    container_name: sensor_clima
    environment:
      - C_DEVICE_COUNT=6
      - SENSOR_LICENSE_PART=V1-FULL
    depends_on:
      gateway:
        condition: service_healthy
      aggregator_java:
        condition: service_started
      aggregator_rust:
        condition: service_started
    networks:
      - smart_city_net
    restart: on-failure
    stop_grace_period: 5s
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ==================================================================
  # 3. POSTE INTELIGENTE (NÓ LUA - CONTROLÁVEL)
  # ==================================================================
  sensor_posto:
    build:
      context: .
      dockerfile: sensor_lua/Dockerfile
      args:
        TARGET_SERVICE: sensor_posto
    container_name: sensor_posto
    environment:
      - SENSOR_LICENSE_PART=V1-FULL
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - smart_city_net
    restart: on-failure
    stop_signal: SIGTERM
    stop_grace_period: 5s
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/5006'"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ==================================================================
  # 4. SEMÁFORO (NÓ JAVA - CONTROLÁVEL)
  # ==================================================================
  sensor_java:
    build:
      context: .
      dockerfile: sensor_java/Dockerfile
      args:
        TARGET_SERVICE: sensor_java
    container_name: sensor_semaforo
    environment:
      - SENSOR_LICENSE_PART=V1-FULL
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - smart_city_net
    restart: on-failure
    stop_grace_period: 5s
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/5003'"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ==================================================================
  # 5. CÂMERA DE TRÁFEGO (NÓ PYTHON - CONTROLÁVEL)
  # ==================================================================
  sensor_camera:
    build:
      context: .
      dockerfile: sensor_python/Dockerfile
      args:
        TARGET_SERVICE: sensor_camera
    container_name: sensor_camera
    environment:
      - PYTHONUNBUFFERED=1
      - SENSOR_LICENSE_PART=V1-FULL
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - smart_city_net
    restart: on-failure
    stop_grace_period: 5s
    healthcheck:
      test: [
        "CMD-SHELL",
        "python -c 'import socket; s=socket.socket(socket.AF_INET, socket.SOCK_STREAM); s.settimeout(1.0); s.connect((\"127.0.0.1\", 5004)); s.close()' || exit 1"
      ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ==================================================================
  # 6. CLIENTE ANALÍTICO (DASHBOARD STREAMLIT)
  # ==================================================================
  dashboard:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        TARGET_SERVICE: dashboard
    container_name: dashboard
    ports:
      - "8501:8501"
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - smart_city_net
    restart: on-failure
    stop_grace_period: 5s
    healthcheck:
      test: [
        "CMD-SHELL",
        "python -c 'import socket; s=socket.socket(socket.AF_INET, socket.SOCK_STREAM); s.settimeout(1.0); s.connect((\"127.0.0.1\", 8501)); s.close()' || exit 1"
      ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # ==================================================================
  # 7. SERVIÇO DE BACKUP ANALÍTICO (GOLANG)
  # ==================================================================
  backup_go:
    build:
      context: ./backup_go
      dockerfile: Dockerfile
    container_name: backup_go
    ports:
      - "8080:8080"
    volumes:
      - gateway_db:/app/gateway_db:ro
      - ./backups:/backups
    environment:
      - DB_PATH=/app/gateway_db/smartcity.db
      - BACKUP_DIR=/backups
    networks:
      - smart_city_net
    restart: always
    depends_on:
      - gateway

networks:
  smart_city_net:
    driver: bridge

volumes:
  gateway_db: