services:
  # ==================================================================
  # 0. CACHE & MESSAGE BROKER (REDIS)
  # ==================================================================
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - smart_city_net
    restart: always

  # ==================================================================
  # 1.A. AGREGADOR JAVA (NETTY)
  # ==================================================================
  aggregator_java:
    build:
      context: .
      dockerfile: aggregators/java/Dockerfile
    container_name: aggregator_java
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AGGREGATOR_ID=java_netty_1
      - MULTICAST_GROUP=239.0.0.1
      - MULTICAST_PORT=5005
      - AES_SECRET_KEY=SmartCityKey1234
    networks:
      - smart_city_net
    restart: always
    depends_on:
      - redis

  # ==================================================================
  # 1.B. AGREGADOR RUST (TOKIO)
  # ==================================================================
  aggregator_rust:
    build:
      context: .
      dockerfile: aggregators/rust/Dockerfile
    container_name: aggregator_rust
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AGGREGATOR_ID=rust_tokio_1
      - MULTICAST_GROUP=239.0.0.1
      - MULTICAST_PORT=5005
      - AES_SECRET_KEY=SmartCityKey1234
    networks:
      - smart_city_net
    restart: always
    depends_on:
      - redis

  # ==================================================================
  # 1. GATEWAY INTELIGENTE (HUB COORDENADOR & OLAP)
  # ==================================================================
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
      args:
        TARGET_SERVICE: gateway
    container_name: gateway
    ports:
      # UDP 5000 e 5002 foram movidos para os agregadores
      - "5001:5001/tcp"  # Interface de streaming analítico e atuação
      - "5007:5007/tcp"  # Interface de autenticação dos sensores
      - "9100:9100/tcp"  # Endpoint de métricas Prometheus (/metrics) — Fase E
    volumes:
      - gateway_db:/app/gateway/db
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - GATEWAY_LICENSE_KEY=SMARTCITY-V1-FULL-LICENSE
      - AES_SECRET_KEY=SmartCityKey1234
      # Cifra+anti-replay do canal de controle. Só ligar (=1) quando TODOS os
      # sensores controláveis (câmera/semáforo/poste) já suportarem o modo seguro.
      - CONTROL_SECURE=0
    networks:
      - smart_city_net
    restart: always
    depends_on:
      - redis
    stop_grace_period: 10s
    healthcheck:
      test: [
        "CMD-SHELL",
        "python -c 'import socket; s=socket.socket(socket.AF_INET, socket.SOCK_STREAM); s.settimeout(1.0); s.connect((\"127.0.0.1\", 5001)); s.close()' || exit 1"
      ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s

  # ==================================================================
  # 2. SENSOR DE CLIMA (NÓ C - CONTÍNUO)
  # ==================================================================
  sensor_clima:
    build:
      context: .
      dockerfile: sensor_c/Dockerfile
      args:
        TARGET_SERVICE: sensor_clima
    container_name: sensor_clima
    environment:
      - C_DEVICE_COUNT=6
      - SENSOR_LICENSE_PART=V1-FULL
      # =1 + 'docker attach sensor_clima' para o console IDLE de status embutido
      - SENSOR_IDLE_CONSOLE=0
    stdin_open: true
    tty: true
    depends_on:
      gateway:
        condition: service_healthy
      aggregator_java:
        condition: service_started
      aggregator_rust:
        condition: service_started
    networks:
      - smart_city_net
    restart: on-failure
    stop_grace_period: 5s
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ==================================================================
  # 3. POSTE INTELIGENTE (NÓ LUA - CONTROLÁVEL)
  # ==================================================================
  sensor_posto:
    build:
      context: .
      dockerfile: sensor_lua/Dockerfile
      args:
        TARGET_SERVICE: sensor_posto
    container_name: sensor_posto
    environment:
      - SENSOR_LICENSE_PART=V1-FULL
      # =1 + 'docker attach sensor_posto' para o console IDLE embutido (requer luaposix)
      - SENSOR_IDLE_CONSOLE=0
      # Cifra+anti-replay do canal de controle (precisa casar com o gateway).
      - AES_SECRET_KEY=SmartCityKey1234
      - CONTROL_SECURE=0
    stdin_open: true
    tty: true
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - smart_city_net
    restart: on-failure
    stop_signal: SIGTERM
    stop_grace_period: 5s
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/5006'"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ==================================================================
  # 4. SEMÁFORO (NÓ JAVA - CONTROLÁVEL)
  # ==================================================================
  sensor_java:
    build:
      context: .
      dockerfile: sensor_java/Dockerfile
      args:
        TARGET_SERVICE: sensor_java
    container_name: sensor_semaforo
    environment:
      - SENSOR_LICENSE_PART=V1-FULL
      # =1 + 'docker attach sensor_semaforo' para o console IDLE embutido
      - SENSOR_IDLE_CONSOLE=0
      # Cifra+anti-replay do canal de controle (precisa casar com o gateway).
      - AES_SECRET_KEY=SmartCityKey1234
      - CONTROL_SECURE=0
    stdin_open: true
    tty: true
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - smart_city_net
    restart: on-failure
    stop_grace_period: 5s
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/5003'"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ==================================================================
  # 5. CÂMERA DE TRÁFEGO (NÓ PYTHON - CONTROLÁVEL)
  # ==================================================================
  sensor_camera:
    build:
      context: .
      dockerfile: sensor_python/Dockerfile
      args:
        TARGET_SERVICE: sensor_camera
    container_name: sensor_camera
    environment:
      - PYTHONUNBUFFERED=1
      - SENSOR_LICENSE_PART=V1-FULL
      # =1 + 'docker attach sensor_camera' para o console IDLE embutido
      - SENSOR_IDLE_CONSOLE=0
      # Cifra+anti-replay do canal de controle (precisa casar com o gateway).
      - AES_SECRET_KEY=SmartCityKey1234
      - CONTROL_SECURE=0
    stdin_open: true
    tty: true
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - smart_city_net
    restart: on-failure
    stop_grace_period: 5s
    healthcheck:
      test: [
        "CMD-SHELL",
        "python -c 'import socket; s=socket.socket(socket.AF_INET, socket.SOCK_STREAM); s.settimeout(1.0); s.connect((\"127.0.0.1\", 5004)); s.close()' || exit 1"
      ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ==================================================================
  # 5.B. SENSOR DE ENCHENTE / NÍVEL D'ÁGUA (NÓ NODE.JS - CONTROLÁVEL)
  # ==================================================================
  sensor_enchente:
    build:
      context: .
      dockerfile: sensor_node/Dockerfile
    container_name: sensor_enchente
    environment:
      - SENSOR_LICENSE_PART=V1-FULL
      - FLOOD_DEVICE_COUNT=4
      # =1 + 'docker attach sensor_enchente' para o console IDLE embutido
      - SENSOR_IDLE_CONSOLE=0
      # Cifra+anti-replay do canal de controle (precisa casar com o gateway).
      - AES_SECRET_KEY=SmartCityKey1234
      - CONTROL_SECURE=0
    stdin_open: true
    tty: true
    depends_on:
      gateway:
        condition: service_healthy
      aggregator_java:
        condition: service_started
      aggregator_rust:
        condition: service_started
    networks:
      - smart_city_net
    restart: on-failure
    stop_grace_period: 5s
    healthcheck:
      test: [
        "CMD-SHELL",
        "node -e 'require(\"net\").connect(5010,\"127.0.0.1\").on(\"connect\",()=>process.exit(0)).on(\"error\",()=>process.exit(1))' || exit 1"
      ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  # ==================================================================
  # 5.C. SENSOR DE RUÍDO AMBIENTE (NÓ RUBY - CONTROLÁVEL)
  # ==================================================================
  sensor_ruido:
    build:
      context: .
      dockerfile: sensor_ruby/Dockerfile
    container_name: sensor_ruido
    environment:
      - SENSOR_LICENSE_PART=V1-FULL
      - NOISE_DEVICE_COUNT=4
      # =1 + 'docker attach sensor_ruido' para o console IDLE embutido
      - SENSOR_IDLE_CONSOLE=0
      # Cifra+anti-replay do canal de controle (precisa casar com o gateway).
      - AES_SECRET_KEY=SmartCityKey1234
      - CONTROL_SECURE=0
    stdin_open: true
    tty: true
    depends_on:
      gateway:
        condition: service_healthy
      aggregator_java:
        condition: service_started
      aggregator_rust:
        condition: service_started
    networks:
      - smart_city_net
    restart: on-failure
    stop_grace_period: 5s
    healthcheck:
      test: [
        "CMD-SHELL",
        "ruby -e 'require \"socket\"; TCPSocket.new(\"127.0.0.1\", 5011).close' || exit 1"
      ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  # ==================================================================
  # 6. CLIENTE ANALÍTICO (DASHBOARD STREAMLIT)
  # ==================================================================
  dashboard:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        TARGET_SERVICE: dashboard
    container_name: dashboard
    ports:
      - "8501:8501"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Login do dashboard. Para tirar do texto puro, use DASHBOARD_PASSWORD_FILE
      # (Docker secret) — ver docker-compose.secrets.yml. Vazio = acesso aberto.
      - DASHBOARD_PASSWORD=smartcity
    depends_on:
      gateway:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - smart_city_net
    restart: on-failure
    stop_grace_period: 5s
    healthcheck:
      test: [
        "CMD-SHELL",
        "python -c 'import socket; s=socket.socket(socket.AF_INET, socket.SOCK_STREAM); s.settimeout(1.0); s.connect((\"127.0.0.1\", 8501)); s.close()' || exit 1"
      ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # ==================================================================
  # 7. SERVIÇO DE BACKUP ANALÍTICO (GOLANG)
  # ==================================================================
  backup_go:
    build:
      context: ./backup_go
      dockerfile: Dockerfile
    container_name: backup_go
    ports:
      - "8080:8080"
    volumes:
      - gateway_db:/app/gateway_db:ro
      - ./backups:/backups
    environment:
      - DB_PATH=/app/gateway_db/smartcity_gateway.db
      - BACKUP_DIR=/backups
    networks:
      - smart_city_net
    restart: always
    depends_on:
      - gateway

  # ==================================================================
  # 8. ALEXA VOICE INTEGRATION (ASK-SDK)
  # ==================================================================
  alexa_skill:
    build:
      context: .
      dockerfile: alexa_skill/Dockerfile
    container_name: alexa_skill
    ports:
      - "5008:5008"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      gateway:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - smart_city_net
    restart: on-failure

  # ==================================================================
  # 9. OBSERVABILIDADE — PROMETHEUS (raspa /metrics do Gateway) — Fase E
  # ==================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - smart_city_net
    restart: always
    depends_on:
      - gateway

networks:
  smart_city_net:
    driver: bridge

volumes:
  gateway_db: