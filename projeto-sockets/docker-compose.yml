services:
  # ==================================================================
  # 1. GATEWAY INTELIGENTE (HUB COORDENADOR)
  # ==================================================================
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: gateway
    ports:
      # Seguro por padrão: acessível somente a partir do host local.
      # Consulte ../SECURITY.md antes de alterar BIND_ADDRESS para 0.0.0.0.
      - "${BIND_ADDRESS:-127.0.0.1}:5000:5000/udp"  # Ingestão de telemetria contínua
      - "${BIND_ADDRESS:-127.0.0.1}:5001:5001/tcp"  # Interface de streaming analítico e atuação
      - "${BIND_ADDRESS:-127.0.0.1}:5002:5002/udp"  # Registro de descoberta de sensores externos
    volumes:
      - gateway_db:/app/gateway/db
    environment:
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      DB_POOL_SIZE: "${DB_POOL_SIZE:-4}"
      WAL_CHECKPOINT_INTERVAL_SECS: "${WAL_CHECKPOINT_INTERVAL_SECS:-300}"
      TELEMETRY_QUEUE_MAXSIZE: "${TELEMETRY_QUEUE_MAXSIZE:-10000}"
      TELEMETRY_BATCH_MAX_PAYLOADS: "${TELEMETRY_BATCH_MAX_PAYLOADS:-100}"
      TELEMETRY_BATCH_MAX_ROWS: "${TELEMETRY_BATCH_MAX_ROWS:-500}"
      TELEMETRY_BATCH_FLUSH_INTERVAL_SECS: "${TELEMETRY_BATCH_FLUSH_INTERVAL_SECS:-1.0}"
      TELEMETRY_SHUTDOWN_TIMEOUT_SECS: "${TELEMETRY_SHUTDOWN_TIMEOUT_SECS:-20}"
      DISCOVERY_MAX_IN_FLIGHT: "${DISCOVERY_MAX_IN_FLIGHT:-256}"
      DISCOVERY_PROBE_INTERVAL_SECS: "${DISCOVERY_PROBE_INTERVAL_SECS:-15}"
      MULTICAST_TTL: "${MULTICAST_TTL:-1}"
      DEVICE_OFFLINE_TIMEOUT_SECS: "${DEVICE_OFFLINE_TIMEOUT_SECS:-45}"
      DEVICE_OFFLINE_CHECK_INTERVAL_SECS: "${DEVICE_OFFLINE_CHECK_INTERVAL_SECS:-5}"
      METRICS_RAW_RETENTION_SECS: "${METRICS_RAW_RETENTION_SECS:-604800}"
      ROLLUP_1M_RETENTION_SECS: "${ROLLUP_1M_RETENTION_SECS:-2592000}"
      ROLLUP_5M_RETENTION_SECS: "${ROLLUP_5M_RETENTION_SECS:-15552000}"
      ROLLUP_1H_RETENTION_SECS: "${ROLLUP_1H_RETENTION_SECS:-31536000}"
      METRICS_RETENTION_INTERVAL_SECS: "${METRICS_RETENTION_INTERVAL_SECS:-3600}"
      ROLLUP_BACKFILL_ON_STARTUP: "${ROLLUP_BACKFILL_ON_STARTUP:-1}"
      OLAP_RAW_MAX_WINDOW_SECS: "${OLAP_RAW_MAX_WINDOW_SECS:-3600}"
      OLAP_1M_MAX_WINDOW_SECS: "${OLAP_1M_MAX_WINDOW_SECS:-86400}"
      OLAP_5M_MAX_WINDOW_SECS: "${OLAP_5M_MAX_WINDOW_SECS:-604800}"
      OLAP_MAX_QUERY_WINDOW_SECS: "${OLAP_MAX_QUERY_WINDOW_SECS:-2592000}"
      OLAP_MAX_GRAPH_POINTS: "${OLAP_MAX_GRAPH_POINTS:-2000}"
      TCP_CLIENT_READ_TIMEOUT: "${TCP_CLIENT_READ_TIMEOUT:-10}"
      TCP_CLIENT_IDLE_TIMEOUT: "${TCP_CLIENT_IDLE_TIMEOUT:-60}"
      TCP_MAX_FRAME_BYTES: "${TCP_MAX_FRAME_BYTES:-1048576}"
      UDP_MAX_DATAGRAM_BYTES: "${UDP_MAX_DATAGRAM_BYTES:-16384}"
      MAX_DEVICE_ID_LENGTH: "${MAX_DEVICE_ID_LENGTH:-128}"
      MAX_MESSAGE_ID_LENGTH: "${MAX_MESSAGE_ID_LENGTH:-128}"
      MAX_METRIC_NAME_LENGTH: "${MAX_METRIC_NAME_LENGTH:-128}"
      MAX_METRIC_UNIT_LENGTH: "${MAX_METRIC_UNIT_LENGTH:-32}"
      MAX_METRICS_PER_PAYLOAD: "${MAX_METRICS_PER_PAYLOAD:-64}"
      MESSAGE_MAX_AGE_SECS: "${MESSAGE_MAX_AGE_SECS:-86400}"
      MESSAGE_MAX_FUTURE_SKEW_SECS: "${MESSAGE_MAX_FUTURE_SKEW_SECS:-300}"
    networks:
      - smart_city_net
    restart: always
    # SIGTERM interrompe entradas e drena a fila antes de fechar o SQLite.
    # A margem inclui os 20s de drenagem e o timeout de escrita do banco.
    stop_grace_period: 45s
    healthcheck:
      test: [
        "CMD-SHELL",
        "python -c 'import socket; s=socket.socket(socket.AF_INET, socket.SOCK_STREAM); s.settimeout(1.0); s.connect((\"127.0.0.1\", 5001)); s.close()' || exit 1"
      ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s

  # ==================================================================
  # 2. SENSOR DE CLIMA (NÓ C - CONTÍNUO)
  # ==================================================================
  sensor_clima:
    build:
      context: .
      dockerfile: sensor_c/Dockerfile
    container_name: sensor_clima
    environment:
      C_DEVICE_COUNT: "${C_DEVICE_COUNT:-6}"  # Ajustável sem recompilação
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - smart_city_net
    restart: on-failure
    # sig_atomic_t keep_running + sigaction(SIGTERM) garantem saída limpa em < 1s.
    stop_grace_period: 5s
    healthcheck:
      # O sensor C não expõe nenhuma porta TCP (não controlável).
      # kill -0 verifica se PID 1 existe e está responsivo a sinais —
      # mais robusto que inspecionar /proc/1/cmdline, que passaria para
      # qualquer processo cujo nome contenha "sensor_c".
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ==================================================================
  # 3. POSTE INTELIGENTE (NÓ LUA - CONTROLÁVEL)
  # ==================================================================
  sensor_posto:
    build:
      context: .
      dockerfile: sensor_lua/Dockerfile
    container_name: sensor_posto
    environment:
      LUA_DEVICE_COUNT: "${LUA_DEVICE_COUNT:-3}"
      CONTROL_COMMAND_MAX_AGE_SECS: "${CONTROL_COMMAND_MAX_AGE_SECS:-300}"
      CONTROL_COMMAND_MAX_FUTURE_SKEW_SECS: "${CONTROL_COMMAND_MAX_FUTURE_SKEW_SECS:-30}"
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - smart_city_net
    restart: on-failure
    # posix.signal(SIGTERM) via luaposix seta keep_running=false;
    # teardown envia STATUS_OFF e fecha sockets em < 1s.
    stop_signal: SIGTERM
    stop_grace_period: 5s
    healthcheck:
      # CONTROL_TCP_PORT = 5006 (sensor_lua/sensor.lua)
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/5006'"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ==================================================================
  # 4. SEMÁFORO (NÓ JAVA - CONTROLÁVEL)
  # ==================================================================
  sensor_java:
    build:
      context: .
      dockerfile: sensor_java/Dockerfile
    container_name: sensor_semaforo
    environment:
      JAVA_DEVICE_COUNT: "${JAVA_DEVICE_COUNT:-3}"
      CONTROL_COMMAND_MAX_AGE_SECS: "${CONTROL_COMMAND_MAX_AGE_SECS:-300}"
      CONTROL_COMMAND_MAX_FUTURE_SKEW_SECS: "${CONTROL_COMMAND_MAX_FUTURE_SKEW_SECS:-30}"
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - smart_city_net
    restart: on-failure
    # Thread.interrupt() propaga para os loops de telemetria e TCP,
    # encerrando ordenadamente em < 1s.
    stop_grace_period: 5s
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/5003'"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ==================================================================
  # 5. CÂMERA DE TRÁFEGO (NÓ PYTHON - CONTROLÁVEL)
  # ==================================================================
  sensor_camera:
    build:
      context: .
      dockerfile: sensor_python/Dockerfile
    container_name: sensor_camera
    environment:
      PYTHONUNBUFFERED: "1"
      CAMERA_DEVICE_COUNT: "${CAMERA_DEVICE_COUNT:-3}"
      CONTROL_COMMAND_MAX_AGE_SECS: "${CONTROL_COMMAND_MAX_AGE_SECS:-300}"
      CONTROL_COMMAND_MAX_FUTURE_SKEW_SECS: "${CONTROL_COMMAND_MAX_FUTURE_SKEW_SECS:-30}"
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - smart_city_net
    restart: on-failure
    # signal.signal(SIGTERM) seta shutdown_event; threads encerram em < 1s.
    stop_grace_period: 5s
    healthcheck:
      test: [
        "CMD-SHELL",
        "python -c 'import socket; s=socket.socket(socket.AF_INET, socket.SOCK_STREAM); s.settimeout(1.0); s.connect((\"127.0.0.1\", 5004)); s.close()' || exit 1"
      ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ==================================================================
  # 6. ESTACIONAMENTO INTELIGENTE (NÓ GO - CONTROLÁVEL)
  # ==================================================================
  sensor_estacionamento:
    build:
      context: .
      dockerfile: sensor_go/Dockerfile
    container_name: sensor_estacionamento
    environment:
      GO_PARKING_DEVICE_COUNT: "${GO_PARKING_DEVICE_COUNT:-3}"
      GATEWAY_HOST: "gateway"
      SENSOR_HOSTNAME: "sensor_estacionamento"
      SENSOR_HEARTBEAT_INTERVAL_SECS: "${SENSOR_HEARTBEAT_INTERVAL_SECS:-10}"
      SENSOR_HEARTBEAT_JITTER_SECS: "${SENSOR_HEARTBEAT_JITTER_SECS:-2}"
      SENSOR_DISCOVERY_JITTER_SECS: "${SENSOR_DISCOVERY_JITTER_SECS:-2}"
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - smart_city_net
    restart: on-failure
    stop_grace_period: 5s
    healthcheck:
      test: ["CMD", "/app/sensor-go", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ==================================================================
  # 7. CLIENTE ANALÍTICO (DASHBOARD STREAMLIT)
  # ==================================================================
  dashboard:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: dashboard
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8501:8501"
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - smart_city_net
    restart: on-failure
    stop_grace_period: 5s
    healthcheck:
      test: [
        "CMD-SHELL",
        "python -c 'import socket; s=socket.socket(socket.AF_INET, socket.SOCK_STREAM); s.settimeout(1.0); s.connect((\"127.0.0.1\", 8501)); s.close()' || exit 1"
      ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

networks:
  smart_city_net:
    driver: bridge

volumes:
  gateway_db:
