[package]
name = "sensor-water"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
build = "build.rs"

[dependencies]
prost = "=0.13.5"
rand = "=0.8.5"
uuid = { version = "=1.12.1", features = ["v4"] }
ctrlc = { version = "=3.4.5", features = ["termination"] }

[build-dependencies]
prost-build = "=0.13.5"
protoc-bin-vendored = "=3.1.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
