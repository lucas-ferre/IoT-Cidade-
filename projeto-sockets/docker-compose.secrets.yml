# ====================================================================
# Override OPT-IN para Docker Secrets (Fase A — segurança)
#
# Tira os segredos (chave AES, licença, senha do dashboard) do texto puro do
# docker-compose.yml e os injeta como Docker secrets montados em /run/secrets.
# O código lê <NAME>_FILE primeiro e cai para a env var <NAME> (compatível).
#
# USO:
#   1. cp secrets/aes_secret_key.txt.example   secrets/aes_secret_key.txt
#      cp secrets/gateway_license.txt.example  secrets/gateway_license.txt
#      cp secrets/dashboard_password.txt.example secrets/dashboard_password.txt
#      (edite os valores reais — esses .txt são ignorados pelo git)
#   2. docker compose -f docker-compose.yml -f docker-compose.secrets.yml up --build
# ====================================================================

services:
  gateway:
    environment:
      - AES_SECRET_KEY_FILE=/run/secrets/aes_secret_key
      - GATEWAY_LICENSE_KEY_FILE=/run/secrets/gateway_license
    secrets:
      - aes_secret_key
      - gateway_license

  aggregator_java:
    environment:
      - AES_SECRET_KEY_FILE=/run/secrets/aes_secret_key
    secrets:
      - aes_secret_key

  aggregator_rust:
    environment:
      - AES_SECRET_KEY_FILE=/run/secrets/aes_secret_key
    secrets:
      - aes_secret_key

  sensor_camera:
    environment:
      - AES_SECRET_KEY_FILE=/run/secrets/aes_secret_key
    secrets:
      - aes_secret_key

  sensor_java:
    environment:
      - AES_SECRET_KEY_FILE=/run/secrets/aes_secret_key
    secrets:
      - aes_secret_key

  sensor_posto:
    environment:
      - AES_SECRET_KEY_FILE=/run/secrets/aes_secret_key
    secrets:
      - aes_secret_key

  sensor_enchente:
    environment:
      - AES_SECRET_KEY_FILE=/run/secrets/aes_secret_key
    secrets:
      - aes_secret_key

  sensor_ruido:
    environment:
      - AES_SECRET_KEY_FILE=/run/secrets/aes_secret_key
    secrets:
      - aes_secret_key

  dashboard:
    environment:
      - DASHBOARD_PASSWORD_FILE=/run/secrets/dashboard_password
    secrets:
      - dashboard_password

secrets:
  aes_secret_key:
    file: ./secrets/aes_secret_key.txt
  gateway_license:
    file: ./secrets/gateway_license.txt
  dashboard_password:
    file: ./secrets/dashboard_password.txt
