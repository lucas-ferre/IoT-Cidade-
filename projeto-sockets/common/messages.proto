syntax = "proto3";

package smartcity;

// ====================================================================
// DEFINIÇÕES DE ENUMERAÇÕES (TOPOLOGIA, CONTROLE E OPERAÇÃO)
// ====================================================================

enum DeviceType {
  DEVICE_TYPE_UNKNOWN = 0;
  DEVICE_TYPE_TRAFFIC_LIGHT = 1;
  DEVICE_TYPE_LAMP_POST = 2;
  DEVICE_TYPE_WEATHER_STATION = 3;
  DEVICE_TYPE_CAMERA = 4;
  DEVICE_TYPE_AIR_QUALITY = 5;
  DEVICE_TYPE_FLOOD = 6;            // Sensor de enchente / nível d'água (Node.js)
  DEVICE_TYPE_NOISE = 7;            // Sensor de ruído ambiente (Ruby)
}

enum DeviceStatus {
  STATUS_UNKNOWN = 0;
  STATUS_ON = 1;
  STATUS_OFF = 2;
  STATUS_ERROR = 3;
}

enum RequestType {
  REQUEST_TYPE_UNKNOWN = 0;
  REQUEST_TYPE_LIST_DEVICES = 1;
  REQUEST_TYPE_SEND_COMMAND = 2;
  REQUEST_TYPE_ANALYTICS_QUERY = 3;
}

enum QueryOp {
  OP_UNKNOWN = 0;
  OP_AVERAGE = 1;
  OP_STD_DEV = 2;
  OP_MAX_VARIATION = 3;
  OP_ANOMALY_DETECTION = 4;
  OP_PERCENTILE_95 = 5;
  OP_LINEAR_TREND = 6;
}

message Metric {
  string name = 1;
  double value = 2;
  string unit = 3;
}

// ====================================================================
// PACOTES DE CAMADA UDP (INGESTÃO DE MÉTRICAS E HANDSHAKE)
// ====================================================================

message AggregatorLoad {
  string aggregator_id = 1;
  string ip_address = 2;
  int32 telemetry_port = 3;
  int32 discovery_port = 4;
  double cpu_load = 5;
  int32 queue_size = 6;
  int64 timestamp = 7;
}

message DiscoveryResponse {
  string message_id = 1;      // ID único da mensagem de descoberta (UUID/Hash)
  int64 timestamp = 2;        // Instante exato do disparo (Epoch)
  string device_id = 3;
  DeviceType type = 4;
  string ip_address = 5;
  int32 control_port = 6;
  DeviceStatus initial_status = 7;
  bool is_controllable = 8;
  string aggregator_id = 9;
  int32 coord_x = 10;
  int32 coord_y = 11;
}

message DataPayload {
  string message_id = 1;      // ID único do datagrama de telemetria
  int64 timestamp = 2;        // Momento de extração da leitura física
  string device_id = 3;
  DeviceStatus current_status = 4;
  repeated Metric metrics = 5;
  int32 coord_x = 6;
  int32 coord_y = 7;
}

// ====================================================================
// PACOTES DE CAMADA TCP (ATUAÇÃO REMOTA E ANÁLISE OLAP)
// ====================================================================

message AuthRequest {
  string device_id = 1;
  DeviceType type = 2;
  string license_key_part = 3;
  string hex_service_code = 4;
}

message AuthResponse {
  bool success = 1;
  string message = 2;
  int32 assigned_port = 3;
}

message ConfigCommand {
  string command_id = 1;      // Identificador único do frame de controle
  int64 timestamp = 2;        // Instante de despacho da ordem pelo Proxy
  bool update_status = 3;
  DeviceStatus target_status = 4;
  bool update_frequency = 5;
  int32 new_frequency_secs = 6;
  string target_device_id = 7;  // Dispositivo virtual alvo dentro de um nó multi-dispositivo
}

message ConfigResponse {
  string message_id = 1;      // ID único da confirmação do nó atuado
  string command_id = 2;      // Chave relacional vinculada à requisição de origem
  int64 timestamp = 3;        // Instante da efetivação do I/O
  bool success = 4;
  string message = 5;
  DeviceStatus updated_status = 6;
  int32 updated_frequency_secs = 7;
}

message DeviceInfo {
  string device_id = 1;
  DeviceType type = 2;
  DeviceStatus status = 3;
  string ip_address = 4;
  int32 control_port = 5;
  bool is_controllable = 6;
  int64 last_seen_timestamp = 7;
  int32 coord_x = 8;
  int32 coord_y = 9;
  string aggregator_id = 10;  // Agregador que repassou a telemetria/descoberta deste nó
}

message ClientRequest {
  string message_id = 1;      // ID único da requisição de multiplexação
  int64 timestamp = 2;        // Instante de emissão pelo cliente (Streamlit)
  RequestType type = 3;
  string target_device_id = 4;
  ConfigCommand command_payload = 5;
  string query_metric = 6;
  QueryOp query_op = 7;
  int64 start_timestamp = 8;
  int64 end_timestamp = 9;
}

message DataPoint {
  int64 timestamp = 1;
  double value = 2;
  string device_id = 3;
}

message ClientResponse {
  string message_id = 1;      // ID único de devolução assíncrona do Gateway
  int64 timestamp = 2;        // Instante da consolidação dos dados em memória
  bool success = 3;
  string message = 4;
  repeated DeviceInfo devices = 5;
  double analytics_result = 6;
  string result_metadata = 7;
  repeated DataPoint graph_points = 8;
}
